[versions]
kotlin             = "2.0.21"
agp                = "8.7.3"
ksp                = "2.0.21-1.0.28"
composeBom         = "2024.12.01"
hilt               = "2.52"
hiltNavCompose     = "1.2.0"
navigation         = "2.8.5"
lifecycle          = "2.8.7"
retrofit           = "2.11.0"
okhttp             = "4.12.0"
moshi              = "1.15.1"
datastore          = "1.1.1"
securityCrypto     = "1.1.0-alpha06"
coroutines         = "1.9.0"
coreKtx            = "1.15.0"
activityCompose    = "1.9.3"
googleMaterial     = "1.12.0"
playServicesAuth   = "21.3.0"
room               = "2.6.1"
camerax            = "1.3.4"
coil               = "2.7.0"

[libraries]
# AndroidX
androidx-core-ktx          = { group = "androidx.core",     name = "core-ktx",         version.ref = "coreKtx" }
androidx-activity-compose  = { group = "androidx.activity", name = "activity-compose",  version.ref = "activityCompose" }

# View XML themes (Theme.Material3.* in themes.xml) — not provided by Compose Material3
google-material = { group = "com.google.android.material", name = "material", version.ref = "googleMaterial" }

# Google Sign-In (SignInScreen — deployed mode)
play-services-auth = { group = "com.google.android.gms", name = "play-services-auth", version.ref = "playServicesAuth" }

# Compose BOM + modules
compose-bom                = { group = "androidx.compose",           name = "compose-bom",          version.ref = "composeBom" }
compose-ui                 = { group = "androidx.compose.ui",        name = "ui" }
compose-ui-graphics        = { group = "androidx.compose.ui",        name = "ui-graphics" }
compose-ui-tooling-preview = { group = "androidx.compose.ui",        name = "ui-tooling-preview" }
compose-ui-tooling         = { group = "androidx.compose.ui",        name = "ui-tooling" }
compose-material3          = { group = "androidx.compose.material3", name = "material3" }

# Lifecycle
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose   = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose",   version.ref = "lifecycle" }
lifecycle-runtime-ktx       = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx",       version.ref = "lifecycle" }

# Navigation
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }

# Hilt
hilt-android           = { group = "com.google.dagger", name = "hilt-android",          version.ref = "hilt" }
hilt-android-compiler  = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt",   name = "hilt-navigation-compose", version.ref = "hiltNavCompose" }

# Networking
retrofit            = { group = "com.squareup.retrofit2", name = "retrofit",           version.ref = "retrofit" }
retrofit-moshi      = { group = "com.squareup.retrofit2", name = "converter-moshi",    version.ref = "retrofit" }
okhttp              = { group = "com.squareup.okhttp3",   name = "okhttp",             version.ref = "okhttp" }
okhttp-logging      = { group = "com.squareup.okhttp3",   name = "logging-interceptor", version.ref = "okhttp" }

# Moshi — chosen over Gson: null-safe, Kotlin-first, KSP codegen avoids reflection
moshi-kotlin        = { group = "com.squareup.moshi", name = "moshi-kotlin",        version.ref = "moshi" }
moshi-kotlin-codegen = { group = "com.squareup.moshi", name = "moshi-kotlin-codegen", version.ref = "moshi" }

# DataStore (token storage)
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# Security (fallback EncryptedSharedPreferences for legacy devices)
security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }

# Coroutines
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# Room — local SQLite for reference_assets, progressions, progression_stages
room-runtime  = { group = "androidx.room", name = "room-runtime",  version.ref = "room" }
room-ktx      = { group = "androidx.room", name = "room-ktx",      version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler",  version.ref = "room" }

# CameraX — trace mode / camera underlay
camerax-core       = { group = "androidx.camera", name = "camera-core",        version.ref = "camerax" }
camerax-camera2    = { group = "androidx.camera", name = "camera-camera2",     version.ref = "camerax" }
camerax-lifecycle  = { group = "androidx.camera", name = "camera-lifecycle",   version.ref = "camerax" }
camerax-view       = { group = "androidx.camera", name = "camera-view",        version.ref = "camerax" }

# Coil — async image loading in Compose (crop preview, progression stages, reference history)
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }

[plugins]
android-application = { id = "com.android.application",              version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android",          version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose",   version.ref = "kotlin" }
hilt-android        = { id = "com.google.dagger.hilt.android",        version.ref = "hilt" }
ksp                 = { id = "com.google.devtools.ksp",               version.ref = "ksp" }
